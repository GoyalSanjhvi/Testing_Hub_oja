<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>OJA Regression Framework</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <header>

        <h1>

            OJA Regression Framework

        </h1>

    </header>


    <!-- ======================================= -->

    <div class="card">

        <h2>

            Execution Mode

        </h2>

        <div class="mode">

            <label>

                <input

                    type="radio"

                    name="mode"

                    value="visual"

                    checked>

                Visual

            </label>

            <label>

                <input

                    type="radio"

                    name="mode"

                    value="regression">

                Regression

            </label>

        </div>

    </div>

    <!-- ======================================= -->

    <div class="card">

        <h2>

            Modules

        </h2>

        <table id="module-table">

            <thead>

            <tr>

                <th>

                    Module

                </th>

                <th>

                    Status

                </th>

                <th>

                    Time

                </th>

                <th>

                    Action

                </th>

            </tr>

            </thead>

            <tbody>

            {% for module in modules %}

            <tr class="module-row">

                <td>

                    {{ module }}

                </td>

                <td>

                    <div class="status waiting">

                        WAITING

                    </div>

                </td>

                <td class="duration">

                    --

                </td>

                <td>

                    <button

                        class="run-btn"

                        data-module="{{ module }}">

                        ▶ Run

                    </button>

                </td>

            </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

    <!-- ======================================= -->

    <div class="buttons">

        <button

            id="run-all"

            class="primary">

            🚀 Run All Tests

        </button>

        <button

            id="report"

            class="secondary"

            style="display:none;">

            📄 View Report

        </button>

    </div>

    <!-- ======================================= -->

    <div class="summary">

        <div class="summary-card">

            <h3>

                Total

            </h3>

            <p id="total">

                {{ modules|length }}

            </p>

        </div>

        <div class="summary-card">

            <h3>

                Passed

            </h3>

            <p id="passed">

                0

            </p>

        </div>

        <div class="summary-card">

            <h3>

                Failed

            </h3>

            <p id="failed">

                0

            </p>

        </div>

        <div class="summary-card">

            <h3>

                Time

            </h3>

            <p id="time">

                --

            </p>

        </div>

    </div>

</div>

<script

src="{{ url_for('static', filename='script.js') }}">

</script>

</body>

</html>

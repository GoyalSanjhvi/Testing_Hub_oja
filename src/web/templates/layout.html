<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}

            OJA Automation Framework

        {% endblock %}

    </title>

    <!-- Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/header.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/toolbar.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/table.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/buttons.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/progress.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/summary.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/modal.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}">

</head>

<body>

    <div class="background"></div>

    <main class="app">

        {% block content %}

        {% endblock %}

    </main>

    <script
        type="module"
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>

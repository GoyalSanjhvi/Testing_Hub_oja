<!-- ========================================= -->
<!-- Execution Progress -->
<!-- ========================================= -->

<section

    id="progress-panel"

    class="progress-panel hidden"

>

    <div class="progress-header">

        <div>

            <h2>

                Running Tests...

            </h2>

            <p>

                Please wait while the framework executes all selected modules.

            </p>

        </div>

        <div

            id="progress-percentage"

            class="progress-percentage"

        >

            0%

        </div>

    </div>

    <!-- Progress Bar -->

    <div class="progress-bar">

        <div

            id="progress-fill"

            class="progress-fill"

        ></div>

    </div>

    <!-- Progress Details -->

    <div class="progress-details">

        <div>

            <strong>

                Completed

            </strong>

            <span

                id="completed-count"

            >

                0 / 0

            </span>

        </div>

        <div>

            <strong>

                Current Module

            </strong>

            <span

                id="current-module"

            >

                --

            </span>

        </div>

        <div>

            <strong>

                Elapsed

            </strong>

            <span

                id="elapsed-time"

            >

                0 s

            </span>

        </div>

    </div>

</section>

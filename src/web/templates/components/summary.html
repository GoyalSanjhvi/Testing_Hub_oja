<section class="summary-panel">

    <div class="summary-header">

        <h2>

            Summary

        </h2>

    </div>

    <div class="summary-content">

        <div class="summary-card summary-pass">

            <span class="summary-label">

                🟢 PASS

            </span>

            <span

                class="summary-value"

                id="pass-count"

            >

                0

            </span>

        </div>

        <div class="summary-card summary-fail">

            <span class="summary-label">

                🔴 FAIL

            </span>

            <span

                class="summary-value"

                id="fail-count"

            >

                0

            </span>

        </div>

        <div class="summary-card summary-waiting">

            <span class="summary-label">

                ⚪ WAITING

            </span>

            <span

                class="summary-value"

                id="waiting-count"

            >

                0

            </span>

        </div>

        <div class="summary-card summary-total">

            <span class="summary-label">

                📦 TOTAL

            </span>

            <span

                class="summary-value"

                id="total-count"

            >

                0

            </span>

        </div>

        <div class="summary-card summary-time">

            <span class="summary-label">

                ⏱ TOTAL TIME

            </span>

            <span

                class="summary-value"

                id="execution-time"

            >

                --

            </span>

        </div>

        <div class="summary-card summary-date">

            <span class="summary-label">

                🕒 LAST EXECUTION

            </span>

            <span

                class="summary-value"

                id="last-run"

            >

                --

            </span>

        </div>

    </div>

</section>

<div class="card">

    <h2>

        Modules

    </h2>

    <table>

        <thead>

            <tr>

                <th>Module</th>

                <th>Status</th>

                <th>Duration</th>

                <th>Logs</th>

                <th>Evidence</th>

                <th>Run</th>

            </tr>

        </thead>

        <tbody>

            {% for module in modules %}

            <tr class="module-row">

                <td>

                    {{ module }}

                </td>

                <td>

                    <span class="status waiting">

                        WAITING

                    </span>

                </td>

                <td class="duration">

                    --

                </td>

                <td>

                    <button

                        class="logs-btn"

                        data-module="{{ module }}">

                        📋

                    </button>

                </td>

                <td>

                    <button

                        class="evidence-btn"

                        data-module="{{ module }}">

                        📷

                    </button>

                </td>

                <td>

                    <button

                        class="run-btn"

                        data-module="{{ module }}">

                        ▶ Run

                    </button>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>


<!-- --------------------------------------- -->
<!-- Logs Modal -->
<!-- --------------------------------------- -->

<div

    id="logs-modal"

    class="modal"

    style="display:none;"

>

    <div class="modal-content">

        <span

            id="close-logs"

            class="close"

        >

            &times;

        </span>

        <h2>

            Execution Log

        </h2>

        <pre id="logs-content">

Loading...

        </pre>

    </div>

</div>


<!-- --------------------------------------- -->
<!-- Evidence Modal -->
<!-- --------------------------------------- -->

<div

    id="evidence-modal"

    class="modal"

    style="display:none;"

>

    <div class="modal-content">

        <span

            id="close-evidence"

            class="close"

        >

            &times;

        </span>

        <h2>

            Evidence

        </h2>

        <div id="evidence-content">

            Loading...

        </div>

    </div>

</div>

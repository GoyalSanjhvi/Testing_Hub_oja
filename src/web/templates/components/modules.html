<section class="modules-panel">

    <table class="modules-table">

        <thead>

            <tr>

                <th>Module</th>

                <th>Status</th>

                <th>Duration</th>

                <th>Logs</th>

                <th>Evidence</th>

                <th>Run</th>

            </tr>

        </thead>

        <tbody>

            {% for module in modules %}

            <tr class="module-row">

                <td class="module-name">

                    <span class="module-icon">

                        📄

                    </span>

                    <span class="module-title">

                        {{ module }}

                    </span>

                </td>

                <td>

                    <span class="status waiting">

                        WAITING

                    </span>

                </td>

                <td class="duration">

                    --

                </td>

                <td>

                    <button
                        class="logs-btn"
                        data-module="{{ module }}">

                        📋 Logs

                    </button>

                </td>

                <td>

                    <button
                        class="evidence-btn"
                        data-module="{{ module }}">

                        📷 Evidence

                    </button>

                </td>

                <td>

                    <button
                        class="run-btn"
                        data-module="{{ module }}">

                        ▶ Execute

                    </button>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</section>

<div class="run-all-container">

    <button
        id="run-all"
        class="run-all-btn">

        🚀 Run All Tests

    </button>

</div>

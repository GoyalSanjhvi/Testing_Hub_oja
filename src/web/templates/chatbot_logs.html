<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>

        Chatbot Logs

    </title>

    <link

        rel="stylesheet"

        href="{{ url_for('static', filename='css/style.css') }}"

    >

</head>

<body>

<div class="container">

    <h1>

        🤖 Chatbot Logs

    </h1>

    <div class="buttons">

        <button

            id="back"

            class="secondary">

            ← Dashboard

        </button>

        <button

            id="delete-selected"

            class="secondary">

            🗑 Delete Selected

        </button>

        <button

            id="delete-all"

            class="primary">

            Delete All

        </button>

    </div>

    <br>

    <input

        id="search"

        type="text"

        placeholder="Search..."

        style="width:100%;padding:10px;"

    >

    <br><br>

    <table id="logsTable">

        <thead>

        <tr>

            <th>

                <input

                    id="select-all"

                    type="checkbox"

                >

            </th>

            <th>Date</th>

            <th>Module</th>

            <th>Status</th>

            <th>Questions</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

</div>

<div

    id="viewer"

    style="display:none;"

>

</div>

<script

src="{{ url_for('static', filename='js/chatbot_logs.js') }}">

</script>

</body>

</html>
